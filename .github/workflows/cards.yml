name: cards-14h
on:
  schedule:
    - cron: "0 17 * * *"   # 14h de Brasilia — publica o card na hora (API da Meta nao agenda feed)
    - cron: "0 19 * * *"   # 16h BRT — RESERVA: se o das 14h atrasou/falhou, cobre o dia (o script nao duplica)
  workflow_dispatch: {}
jobs:
  publicar-card:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: publicar proximo card no Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python pipeline/publish_card.py
      - name: marcar publicado
        run: |
          git config user.name "esteira-bot"
          git config user.email "esteira@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "card: publicado [skip ci]"
          git push
