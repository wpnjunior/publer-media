name: cards-14h
on:
  schedule:
    - cron: "0 12 * * *"   # 09h de Brasilia — agenda o card das 14h do mesmo dia
  workflow_dispatch: {}
jobs:
  publicar-card:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: agendar proximo card
        env:
          PUBLER_KEY: ${{ secrets.PUBLER_KEY }}
        run: python pipeline/publish_card.py
      - name: marcar publicado
        run: |
          git config user.name "esteira-bot"
          git config user.email "esteira@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "card: agendado [skip ci]"
          git push
