name: cards-14h
on:
  schedule:
    # O GitHub atrasa o cron em 3 a 5 horas neste repo. Por isso roda de hora em hora e o script
    # so publica dentro da faixa do dia (14h30-16h30 de Brasilia, minuto variado) e uma vez por dia.
    - cron: "43 12-23 * * *"
  workflow_dispatch: {}
jobs:
  publicar-card:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: publicar proximo card no Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FORCAR: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python pipeline/publish_card.py
      - name: marcar publicado
        run: |
          git config user.name "esteira-bot"
          git config user.email "esteira@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "card: publicado [skip ci]"
          git push
