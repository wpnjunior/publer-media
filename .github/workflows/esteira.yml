name: esteira-publica
# Carrossel da esteira (queue/) publicado NA HORA no Instagram pela API oficial da Meta.
# Trocou o Publer em 23/10/2026: a API da Meta nao agenda post de feed, entao o cron roda as 20h BRT
# e publica a pasta mais antiga com "published": false e schedule_at vencido (uma por dia).
on:
  schedule:
    - cron: "0 23 * * *"   # 20h de Brasilia
    - cron: "0 1 * * *"    # 22h BRT - RESERVA: se o das 20h falhou, cobre o dia (o script nao duplica)
  workflow_dispatch: {}
concurrency:
  group: esteira-publica
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            queue
            pipeline
      - name: sabor nos slides (PNG -> JPEG limpo)
        id: fila
        run: |
          pip install --quiet pillow
          python pipeline/publish_queue_ig.py preparar
      - name: subir os JPEG (a Meta baixa pela URL raw)
        if: steps.fila.outputs.dir != ''
        run: |
          git config user.name "esteira-bot"
          git config user.email "esteira@users.noreply.github.com"
          git add "${{ steps.fila.outputs.dir }}/jpg"
          git commit -m "esteira: sabor nos slides [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin master && git push -q && break; sleep 5; done
      - name: publicar no Instagram
        if: steps.fila.outputs.dir != ''
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python pipeline/publish_queue_ig.py publicar "${{ steps.fila.outputs.dir }}"
      - name: marcar publicado
        if: steps.fila.outputs.dir != ''
        run: |
          git add -A queue
          git diff --cached --quiet || git commit -m "esteira: carrossel publicado [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin master && git push -q && break; sleep 5; done
